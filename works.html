<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Works — GUIYEON</title>
<meta name="description" content="귀연이 만든 분재 작품의 기록. 판매 여부와 관계없이 모두 남깁니다.">
<meta name="theme-color" content="#111110">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400&display=swap" rel="stylesheet">

<body data-page="works">
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header data-site-head></header>
<main id="main">

<div class="page-head">
  <div class="wrap grid">
    <h1 class="title-lg">Works</h1>
    <p class="count field" data-count></p>
    <p class="small">판매 여부와 관계없이 모든 작품을 기록합니다. 등록번호는 나무를 들인 순서입니다.</p>
  </div>
</div>
<div class="wrap">
  <div class="filters" role="group" aria-label="작품 상태로 거르기">
    <button type="button" data-filter="all" aria-pressed="true">ALL</button>
    <button type="button" data-filter="Available" aria-pressed="false">AVAILABLE</button>
    <button type="button" data-filter="Sold" aria-pressed="false">SOLD</button>
    <button type="button" data-filter="Private Collection" aria-pressed="false">PRIVATE COLLECTION</button>
  </div>
  <div class="grid archive" data-archive></div>
</div>
<div style="height:var(--band)"></div>
</main>
<footer data-site-foot></footer>
<script src="assets/js/main.js"></script>
