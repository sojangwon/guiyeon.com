<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Available — GUIYEON</title>
<meta name="description" content="지금 구매할 수 있는 귀연의 작품. 계좌이체로만 구매할 수 있습니다.">
<meta name="theme-color" content="#111110">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="available">
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header data-site-head></header>
<main id="main">

<div class="page-head">
  <div class="wrap grid">
    <h1 class="title-lg">Available</h1>
    <p class="count field" data-count></p>
    <p class="small">작품 기록 가운데 지금 새 주인을 기다리는 나무입니다. 한 그루씩 직접 포장해 보냅니다. 구매는 계좌이체로만 받습니다.</p>
  </div>
</div>
<div class="wrap" data-pieces></div>
<section class="band band--card" aria-labelledby="h-steps">
  <div class="wrap">
    <div class="band-head">
      <h2 class="title-md" id="h-steps">구매 절차</h2>
      <p class="field" style="margin:0">Bank transfer only</p>
    </div>
    <ol class="steps">
      <li>작품 선택</li>
      <li>구매 신청</li>
      <li>계좌 안내</li>
      <li>입금 확인</li>
      <li>주문 확정</li>
      <li>배송 또는 수령</li>
    </ol>
    <p class="small" style="margin-top:48px">카드 결제는 받지 않습니다. 신청을 받으면 작품을 하루 동안 다른 분께 안내하지 않습니다. <span class="todo">[확인 필요]</span></p>
  </div>
</section>
</main>
<footer data-site-foot></footer>
<script src="assets/js/main.js"></script>
</body>
</html>
