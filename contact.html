<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — GUIYEON</title>
<meta name="description" content="귀연과 연결되는 곳. Instagram, Naver Smart Store, 메일.">
<meta name="theme-color" content="#111110">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header data-site-head></header>
<main id="main">

<div class="page-head">
  <div class="wrap grid">
    <h1 class="title-lg">Contact</h1>
    <p class="small">작업 과정은 Instagram에 기록합니다. 일반 판매 상품은 스마트스토어에 있습니다. 작품 구매와 진단 문의는 메일로 받습니다.</p>
  </div>
</div>
<div class="wrap" style="padding-bottom:var(--band)">
  <ul class="channels">
    <li><a data-ig href="#" target="_blank" rel="noopener">
      <span class="field">작업 기록</span>
      <span class="title-lg">Instagram</span>
      <span class="go small" data-ig-handle></span></a></li>
    <li><a data-store href="#" target="_blank" rel="noopener">
      <span class="field">외부 판매</span>
      <span class="title-lg">Naver Smart Store</span>
      <span class="go small">스마트스토어로 이동</span></a></li>
    <li><a data-mail href="#">
      <span class="field">구매 · 진단 문의</span>
      <span class="title-lg">Mail</span>
      <span class="go small" data-mail-addr></span></a></li>
  </ul>
  <p class="small" style="margin-top:48px">나무의 상태가 걱정되시면 잎과 줄기, 흙이 보이게 사진 세 장을 보내 주십시오. 무엇이 문제인지와 그 이유를 함께 답해 드립니다.</p>
  <p class="field" style="margin-top:24px">Seoul / Korea</p>
</div>
</main>
<footer data-site-foot></footer>
<script src="assets/js/main.js"></script>
</body>
</html>
