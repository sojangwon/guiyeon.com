<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — GUIYEON</title>
<meta name="description" content="귀연의 작품 기록.">
<meta name="theme-color" content="#111110">
<link rel="icon" type="image/png" href="images/brand/favicon.png">
<link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin>
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="work">
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header data-site-head></header>
<main id="main">

<article class="detail" data-detail>
  <div class="wrap grid" data-detail-grid>
    <div class="plate-col" data-plate>
      <button class="detail-plate-btn" type="button" data-cursor="ENLARGE" aria-label="사진 크게 보기">
        <figure class="plate" id="detail-plate" style="view-transition-name: work-plate">
          <figcaption class="plate__label" aria-hidden="true"></figcaption>
          <img alt="">
        </figure>
      </button>
    </div>
    <div class="info-col" data-info></div>
  </div>
</article>
<script>try{var s=sessionStorage.getItem("gy-vt-img");if(s){document.querySelector("#detail-plate img").src=s;}}catch(e){}</script>
<div style="height:calc(var(--band) * 0.5)"></div>
</main>
<footer data-site-foot></footer>
<script src="assets/js/main.js"></script>
</body>
</html>
